const PALETTE = ['#5B63E8','#12B76A','#F79009','#F04438','#3B82F6','#A855F7','#14B8A6','#EC4899','#84CC16','#F97316','#06B6D4'];
function SpendingChart() {
  const { state } = useFinance();
  const { categoryTotals, totalExpenses } = analyzeCurrentMonth(state.transactions);
  const data = Object.entries(categoryTotals).filter(([,v])=>(v||0)>0).sort((a,b)=>(b[1]||0)-(a[1]||0)).map(([name,value])=>({name,value}));
  if (!data.length) return <div className="rounded-xl2 border border-line bg-surface shadow-card px-5 py-4 h-full flex items-center justify-center"><span className="text-ink-400 text-sm">No spending data yet this month.</span></div>;

  const total = data.reduce((s,d)=>s+d.value,0);
  const cx=110, cy=110, rOuter=95, rInner=58;
  let angle = -90;
  const arcs = data.map((d,i) => {
    const sweep = (d.value/total)*360;
    const startAngle = angle, endAngle = angle + sweep;
    angle = endAngle;
    const toXY = (r,a) => { const rad=(a*Math.PI)/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)]; };
    const [x1,y1] = toXY(rOuter, startAngle), [x2,y2] = toXY(rOuter, endAngle);
    const [x3,y3] = toXY(rInner, endAngle), [x4,y4] = toXY(rInner, startAngle);
    const large = sweep > 180 ? 1 : 0;
    const path = `M ${x1} ${y1} A ${rOuter} ${rOuter} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${rInner} ${rInner} 0 ${large} 0 ${x4} ${y4} Z`;
    return { path, color: PALETTE[i % PALETTE.length], name:d.name, value:d.value };
  });

  return (
    <div className="rounded-xl2 border border-line bg-surface shadow-card px-5 py-4 h-full flex flex-col">
      <div className="text-xs text-ink-500 font-medium mb-1">Spending breakdown</div>
      <div className="flex-1 flex items-center gap-6 min-h-[220px]">
        <svg width="220" height="220" viewBox="0 0 220 220" className="shrink-0">
          {arcs.map((a,i) => <path key={i} d={a.path} fill={a.color}><title>{a.name}: {inr(a.value)}</title></path>)}
          <circle cx={cx} cy={cy} r={rInner-2} fill="#FFFFFF" />
          <text x={cx} y={cy-4} textAnchor="middle" fill="#171A2B" fontSize="14" fontWeight="700" fontFamily="Plus Jakarta Sans">{inr(total)}</text>
          <text x={cx} y={cy+14} textAnchor="middle" fill="#8D92A8" fontSize="10">total</text>
        </svg>
        <div className="flex-1 space-y-1.5 overflow-y-auto max-h-[220px] pr-1">
          {arcs.map((a,i) => (
            <div key={i} className="flex items-center justify-between text-xs">
              <span className="flex items-center gap-2 text-ink-700"><span className="w-2 h-2 rounded-full shrink-0" style={{background:a.color}} />{a.name}</span>
              <span className="num text-ink-900 font-medium">{inr(a.value)}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function StatusBadge({ status }) {
  const map = { under:{text:'On track',cls:'text-good-600 bg-good-50'}, near:{text:'Near limit',cls:'text-warn-600 bg-warn-50'}, over:{text:'Over budget',cls:'text-bad-600 bg-bad-50'} };
  const s = map[status];
  return <span className={`text-[11px] font-medium px-2 py-0.5 rounded-full ${s.cls}`}>{s.text}</span>;
}
function ProgressBar({ pct: p, status }) {
  const color = status==='over' ? 'bg-bad-500' : status==='near' ? 'bg-warn-500' : 'bg-good-500';
  return <div className="h-1.5 rounded-full bg-surface2 overflow-hidden"><div className={`h-full ${color} transition-all duration-500`} style={{width:`${Math.min(100,p)}%`}} /></div>;
}
function BudgetHealth() {
  const { state } = useFinance();
  const summary = totalBudgetSummary(state.transactions, state.profile);
  return (
    <div className="rounded-xl2 border border-line bg-surface shadow-card px-5 py-4">
      <div className="flex items-baseline justify-between mb-3"><div className="text-xs text-ink-500 font-medium">Budget health</div><StatusBadge status={summary.status} /></div>
      <div className="flex items-baseline gap-2 mb-2"><span className="num text-2xl font-bold text-ink-900">{inr(summary.actual)}</span><span className="text-ink-400 text-sm">/ {inr(summary.budget)}</span></div>
      <ProgressBar pct={summary.pctUsed} status={summary.status} />
      <div className="text-xs text-ink-500 mt-2">{summary.remaining>=0 ? <React.Fragment>{inr(summary.remaining)} remaining this month</React.Fragment> : <span className="text-bad-600">{inr(Math.abs(summary.remaining))} over budget</span>}</div>
      {state.budgets.filter(b=>b.status!=='under').length > 0 && (
        <div className="mt-4 pt-4 border-t border-line space-y-2.5">
          <div className="text-[11px] text-ink-400 font-medium mb-1">Categories to watch</div>
          {state.budgets.filter(b=>b.status!=='under').slice(0,4).map(b => (
            <div key={b.category} className="flex items-center justify-between text-sm">
              <span className="text-ink-700">{b.category}</span>
              <span className="num flex items-center gap-2"><span className={`font-medium ${b.status==='over' ? 'text-bad-600' : 'text-warn-600'}`}>{pct(b.pctUsed)}</span><span className="text-ink-400 text-xs">{inr(b.actual)}/{inr(b.budget)}</span></span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
function ObligationsPanel() {
  const { state } = useFinance();
  return (
    <div className="rounded-xl2 border border-line bg-surface shadow-card px-5 py-4">
      <div className="text-xs text-ink-500 font-medium mb-3">Upcoming obligations</div>
      {!state.obligations.length ? <div className="text-sm text-ink-400 py-4">No obligations due in the next 30 days.</div> : (
        <div>{state.obligations.map(o => (
          <div key={o.id} className="flex items-center justify-between py-2.5 border-b border-line last:border-b-0">
            <div><div className="text-sm text-ink-900 font-medium">{o.name}</div><div className="text-xs text-ink-400">{formatDate(o.dueDate)}</div></div>
            <div className="text-right"><div className="num text-sm text-ink-900 font-medium">{inr(o.amount)}</div><div className={`text-xs ${o.status==='overdue' ? 'text-bad-600' : o.status==='due-soon' ? 'text-warn-600' : 'text-ink-400'}`}>{relativeDays(o.daysRemaining)}</div></div>
          </div>
        ))}</div>
      )}
    </div>
  );
}
function RecurringPanel() {
  const { state } = useFinance();
  const total = state.recurring.reduce((s,r)=>s+r.amount,0);
  return (
    <div className="rounded-xl2 border border-line bg-surface shadow-card px-5 py-4">
      <div className="flex items-baseline justify-between mb-3"><div className="text-xs text-ink-500 font-medium">Recurring payments</div><div className="num text-xs text-ink-400">{inr(total)}/mo</div></div>
      {!state.recurring.length ? <div className="text-sm text-ink-400 py-4">No recurring payments detected yet.</div> : (
        <div>{state.recurring.map(r => (
          <div key={r.merchant} className="flex items-center justify-between py-2.5 border-b border-line last:border-b-0">
            <div><div className="text-sm text-ink-900 font-medium">{r.merchant}</div><div className="text-xs text-ink-400 capitalize">{r.frequency} · {r.category}</div></div>
            <div className="num text-sm text-ink-900 font-medium">{inr(r.amount)}</div>
          </div>
        ))}</div>
      )}
    </div>
  );
}
function GoalCard() {
  const { state } = useFinance();
  const goal = calculateGoalProgress(state.transactions, state.profile);
  if (!goal) return <div className="rounded-xl2 border border-line bg-surface shadow-card px-5 py-4 h-full flex items-center justify-center text-sm text-ink-400">No savings goal set.</div>;
  const radius=54, circumference=2*Math.PI*radius, progress=Math.min(100,goal.progressPct), offset=circumference*(1-progress/100);
  return (
    <div className="rounded-xl2 border border-line bg-gradient-to-br from-brand-50 to-surface shadow-card px-6 py-5 h-full">
      <div className="text-xs text-ink-500 font-medium mb-4">Financial goal</div>
      <div className="flex items-center gap-6">
        <div className="relative w-32 h-32 shrink-0">
          <svg width="128" height="128" viewBox="0 0 128 128" className="-rotate-90">
            <circle cx="64" cy="64" r={radius} fill="none" stroke="#E7E9F2" strokeWidth="10" />
            <circle cx="64" cy="64" r={radius} fill="none" stroke="#5B63E8" strokeWidth="10" strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={offset} style={{transition:'stroke-dashoffset 0.6s ease'}} />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center"><span className="font-extrabold text-2xl text-brand-600">{pct(progress)}</span><span className="text-[10px] text-ink-400">funded</span></div>
        </div>
        <div className="flex-1 min-w-0">
          <div className="font-bold text-lg text-ink-900 truncate">{goal.goalName}</div>
          <div className="num text-sm text-ink-700 mt-1">{inr(goal.savedSoFar)} <span className="text-ink-400">of {inr(goal.targetAmount)}</span></div>
          <div className="text-xs text-ink-500 mt-3">{goal.monthsRemaining} month{goal.monthsRemaining===1?'':'s'} remaining</div>
          <div className="text-xs text-ink-500">Needs <span className="num text-ink-700 font-medium">{inr(goal.requiredMonthlySaving)}</span>/mo</div>
        </div>
      </div>
      <div className={`mt-4 pt-4 border-t border-line text-xs font-medium ${goal.onTrack ? 'text-good-600' : 'text-bad-600'}`}>
        {goal.onTrack ? `On track — projected net saving of ${inr(goal.currentMonthNetSaving)} this month meets pace.` : `Behind pace by about ${inr(Math.abs(goal.gapPerMonth))}/month based on current spending.`}
      </div>
    </div>
  );
}
const INSIGHT_DOT = { positive:'bg-good-500', warning:'bg-bad-500', neutral:'bg-info-500' };
function InsightsPanel() {
  const { state } = useFinance();
  return (
    <div className="rounded-xl2 border border-line bg-surface shadow-card px-5 py-4">
      <div className="flex items-center justify-between mb-3">
        <div className="text-xs text-ink-500 font-medium">Spending updates</div>
        <span className="text-[11px] text-ink-400">Based on your recorded transactions</span>
      </div>
      {!state.insights.length ? <div className="text-sm text-ink-400 py-4">Updates will appear here once you have transaction data.</div> : (
        <div className="space-y-3">{state.insights.map(insight => (
          <div key={insight.id} className="flex gap-2.5 fade-in">
            <span className={`w-1.5 h-1.5 rounded-full mt-1.5 shrink-0 ${INSIGHT_DOT[insight.kind]}`} />
            <span className="text-sm text-ink-700 leading-relaxed">{insight.text}</span>
          </div>
        ))}</div>
      )}
    </div>
  );
}

function BehavioralInsightsPanel({ onAskFinora }) {
  const { state } = useFinance();
  const behavior = analyzeBehavior(state.transactions);
  return (
    <div className="rounded-xl2 border border-line bg-surface shadow-card px-5 py-4">
      <div className="flex items-start justify-between gap-4 mb-2">
        <div>
          <div className="text-xs text-ink-500 font-medium">Spending patterns</div>
          <div className="text-[11px] text-ink-400 mt-1">Measured from transaction frequency, mix, timing, and optional context.</div>
        </div>
        <button onClick={onAskFinora} className="text-xs text-brand-600 hover:text-brand-700 font-semibold shrink-0">Ask about patterns →</button>
      </div>
      <p className="text-sm text-ink-700 leading-relaxed mb-3">{behavior.summary}</p>
      {!behavior.indicators.length ? (
        <div className="rounded-lg bg-surface2 px-3 py-2 text-xs text-ink-400">More recorded transactions will make these signals more useful.</div>
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
          {behavior.indicators.map(i => (
            <div key={i.id} className="rounded-lg border border-line bg-surface2 px-3 py-2">
              <div className="flex items-center justify-between gap-2"><span className="text-xs font-semibold text-ink-700">{i.label}</span><span className="num text-xs font-bold text-brand-600">{i.value}</span></div>
              <div className="text-[11px] text-ink-500 mt-1 leading-relaxed">{i.detail}</div>
            </div>
          ))}
        </div>
      )}
      {behavior.actions && behavior.actions.length > 0 && (
        <div className="mt-3 rounded-lg bg-brand-50 border border-brand-100 px-3 py-2">
          <div className="text-[11px] font-semibold text-brand-700">Worth checking</div>
          <div className="text-xs text-ink-700 mt-1">{behavior.actions[0]}</div>
        </div>
      )}
      <div className="text-[11px] text-ink-400 mt-3">Privacy: transaction context stays in this browser demo; it is not sent to an external AI or backend.</div>
    </div>
  );
}

function Dashboard({ onAskFinora }) {
  const { state } = useFinance();
  return (
    <div className="h-full overflow-y-auto px-8 py-6">
      <div className="flex items-start justify-between mb-6">
        <div>
          <h1 className="font-extrabold text-xl text-ink-900">Your money at a glance</h1>
          <p className="text-sm text-ink-500 mt-1">{state.transactions.length ? `${state.transactions.length} transaction${state.transactions.length===1?'':'s'} recorded` : 'No transactions yet — add one in the sidebar or upload a statement.'}</p>
        </div>
        <button onClick={onAskFinora} className="rounded-lg border border-brand-200 bg-brand-50 hover:bg-brand-100 transition-colors text-brand-700 text-sm font-semibold px-4 py-2 shrink-0">Review my spending</button>
      </div>
      <div className="space-y-5">
        <OverviewCards />
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div className="lg:col-span-2"><SpendingChart /></div>
          <GoalCard />
        </div>
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <BudgetHealth /><ObligationsPanel /><RecurringPanel />
        </div>
        <InsightsPanel />
        <BehavioralInsightsPanel onAskFinora={onAskFinora} />
      </div>
    </div>
  );
}
</script>
<script type="text/babel" data-presets="react">

// ═════════════════════════════════════════════════════════════════
// COMPONENT — Finora Activity panel
// ═════════════════════════════════════════════════════════════════
function StatusIcon({ status }) {
  if (status==='done') return <span className="w-4 h-4 rounded-full bg-good-50 text-good-600 flex items-center justify-center text-[10px] shrink-0">✓</span>;
  if (status==='active') return <span className="w-2 h-2 rounded-full bg-brand-500 pulse-dot shrink-0 ml-1 mr-1" />;
  return <span className="w-2 h-2 rounded-full bg-surface2 border border-line shrink-0 ml-1 mr-1" />;
}
function ActivityPanel({ steps }) {
  return (
    <div className="rounded-xl border border-line bg-surface2 px-4 py-3 space-y-2">
      <div className="text-[11px] text-ink-500 font-semibold mb-1">Finora Activity</div>
      {steps.map(step => (
        <div key={step.id} className="flex items-center gap-2.5 text-sm">
          <StatusIcon status={step.status} />
          <span className={step.status==='done' ? 'text-ink-400 line-through decoration-ink-300' : step.status==='active' ? 'text-ink-900 font-medium' : 'text-ink-400'}>
            {step.label}{step.status==='active' ? '…' : ''}
          </span>
        </div>
      ))}
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════
// COMPONENT — Ask Finora chat
// ═════════════════════════════════════════════════════════════════
const SUGGESTIONS = ['Can I spend ₹5,000 this month?','Where am I overspending?','What subscriptions do I have?','What bills are coming up?','Am I on track for my savings goal?','What spending patterns do you see?'];

function Chat() {
  const { state, recordTurn } = useFinance();
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    const el = scrollRef.current;
    if (el && typeof el.scrollTo === 'function') el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
    else if (el) el.scrollTop = el.scrollHeight;
  }, [messages]);

  const ask = async (question) => {
    if (!question.trim() || busy) return;
    setBusy(true);
    const userMsg = { id:`u-${Date.now()}`, role:'user', text:question };
    const agentMsgId = `a-${Date.now()}`;
    setMessages(prev => [...prev, userMsg, { id:agentMsgId, role:'agent', pending:true, liveSteps:[] }]);
    setInput('');
    const turn = await runAgent(question, state, (steps) => {
      setMessages(prev => prev.map(m => m.id===agentMsgId ? { ...m, liveSteps: steps } : m));
    });
    setMessages(prev => prev.map(m => m.id===agentMsgId ? { ...m, pending:false, turn } : m));
    recordTurn(turn);
    setBusy(false);
  };

  return (
    <div className="h-full flex flex-col bg-canvas">
      <div ref={scrollRef} className="flex-1 overflow-y-auto px-8 py-7">
        {!messages.length && (
          <div className="max-w-2xl mx-auto text-center pt-16">
            <h1 className="font-extrabold text-2xl text-ink-900 mb-2">Ask Finora</h1>
            <p className="text-ink-500 text-sm mb-8">Ask about your spending, subscriptions, bills, or savings goal — Finora reasons over your actual recorded data, not guesses.</p>
            <div className="grid grid-cols-2 gap-2.5 text-left">
              {SUGGESTIONS.map(s => <button key={s} onClick={()=>ask(s)} className="rounded-xl border border-line bg-surface hover:border-brand-300 hover:bg-brand-50/50 transition-colors px-4 py-3 text-sm text-ink-700 hover:text-ink-900 shadow-card">{s}</button>)}
            </div>
          </div>
        )}
        <div className="max-w-2xl mx-auto space-y-5">
          {messages.map(m => (
            <div key={m.id} className={m.role==='user' ? 'flex justify-end' : 'flex justify-start'}>
              {m.role==='user' ? (
                <div className="bg-brand-500 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 text-sm max-w-[85%] shadow-pop">{m.text}</div>
              ) : (
                <div className="w-full space-y-2.5">
                  {m.pending && m.liveSteps && <ActivityPanel steps={m.liveSteps} />}
                  {m.turn && (
                    <div className="fade-in space-y-2.5">
                      <details className="group">
                        <summary className="list-none cursor-pointer text-[11px] text-ink-400 hover:text-ink-600 select-none">▸ Finora Activity ({m.turn.toolsUsed.length} tool{m.turn.toolsUsed.length===1?'':'s'} used)</summary>
                        <div className="mt-2"><ActivityPanel steps={m.turn.activitySteps} /></div>
                      </details>
                      <div className="rounded-2xl rounded-tl-sm border border-line bg-surface shadow-card px-4 py-3 text-sm text-ink-900 leading-relaxed">{m.turn.answer}</div>
                    </div>
                  )}
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
      <div className="border-t border-line bg-surface px-8 py-4">
        <form onSubmit={e=>{e.preventDefault(); ask(input);}} className="max-w-2xl mx-auto flex items-center gap-2.5">
          <input value={input} onChange={e=>setInput(e.target.value)} placeholder="Ask about your finances…"
            className="flex-1 rounded-lg bg-surface2 border border-line focus:border-brand-500 focus:ring-2 focus:ring-brand-100 focus:outline-none px-4 py-2.5 text-sm text-ink-900" disabled={busy} />
          <button type="submit" disabled={busy || !input.trim()} className="rounded-lg bg-brand-500 hover:bg-brand-600 disabled:opacity-40 disabled:cursor-not-allowed transition-colors text-white font-semibold text-sm px-5 py-2.5">Ask</button>
        </form>
        <p className="max-w-2xl mx-auto text-[11px] text-ink-400 mt-2">Finora is decision-support software, not a financial advisor. It doesn't give investment or stock advice.</p>
      </div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════
// COMPONENT — brief loading screen while demo data auto-provisions
// ═════════════════════════════════════════════════════════════════
function LoadingScreen() {
  return (
    <div className="min-h-screen w-full flex items-center justify-center bg-canvas">
      <div className="flex flex-col items-center gap-3">
        <span className="w-8 h-8 rounded-full border-2 border-brand-200 border-t-brand-500 spin" />
        <span className="text-sm text-ink-500 font-medium">Setting up your dashboard…</span>
      </div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════
// APP ROOT
// ═════════════════════════════════════════════════════════════════
function AppShell() {
  const { state } = useFinance();
  const [view, setView] = useState('dashboard');
  const { user, login, logout } = useAuth();

  // Signing in shows the "Set up your finances" screen so the person enters
  // their own data from zero (or picks demo/email/upload) instead of the
  // dashboard being auto-populated with the demo dataset.
  if (!user) return <Login onLogin={login} />;
  if (!state.onboarded) return <ConnectData />;
  return (
    <Layout view={view} onChangeView={setView} user={user} onLogout={logout}>
      {view === 'dashboard' ? <Dashboard onAskFinora={()=>setView('chat')} /> : <Chat />}
    </Layout>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FinanceProvider><AppShell /></FinanceProvider>);
</script>
</body>
</html>
