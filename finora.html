// ═════════════════════════════════════════════════════════════════
// FORMAT HELPERS
// ═════════════════════════════════════════════════════════════════
function inr(amount) {
  const r = Math.round(amount); const sign = r < 0 ? '-' : '';
  return `${sign}₹${Math.abs(r).toLocaleString('en-IN')}`;
}
function pct(n) { return `${Math.round(n)}%`; }
function formatDate(isoStr) { return new Date(isoStr).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }); }
function relativeDays(days) {
  if (days < 0) return `${Math.abs(days)} day${Math.abs(days)===1?'':'s'} overdue`;
  if (days === 0) return 'due today';
  if (days === 1) return 'due tomorrow';
  return `in ${days} days`;

<script type="text/babel" data-presets="react">

// ═════════════════════════════════════════════════════════════════
// TOOL 2 — Expense Categorizer (hybrid keyword rules + heuristics)
// ═════════════════════════════════════════════════════════════════
function categorizeTransaction(description, merchant, type) {
  const text = `${description} ${merchant || ''}`.toLowerCase();
  if (type === 'credit') {
    for (const kw of CATEGORY_KEYWORDS.Income) {
      if (text.includes(kw)) return { category:'Income', confidence:0.95, reason:`Matched income keyword "${kw}".` };
    }
    return { category:'Income', confidence:0.6, reason:'Credited transaction, treated as income by default.' };
  }
  let best = null;
  Object.keys(CATEGORY_KEYWORDS).forEach((cat) => {
    if (cat === 'Income') return;
    for (const kw of CATEGORY_KEYWORDS[cat]) {
      if (text.includes(kw)) {
        const score = kw.length;
        if (!best || score > best.score) best = { category: cat, score, matched: kw };
      }
    }
  });
  if (best) return { category: best.category, confidence:0.9, reason:`Matched keyword "${best.matched}" in "${description}".` };
  if (/\bemi\b|loan|installment/.test(text)) return { category:'Bills', confidence:0.6, reason:'Description suggests a loan/EMI installment.' };
  if (/insurance|premium/.test(text)) return { category:'Bills', confidence:0.55, reason:'Description mentions insurance/premium.' };
  if (/transfer|upi|imps|neft/.test(text)) return { category:'Other', confidence:0.35, reason:'Generic transfer with no further detail.' };
  return { category:'Other', confidence:0.3, reason:'No matching category rule found for this description.' };
}

// ═════════════════════════════════════════════════════════════════
// TOOL 1 — Transaction Analyzer
// ═════════════════════════════════════════════════════════════════
function analyzeTransactions(transactions, opts) {
  opts = opts || {};
  let txns = transactions;
  if (opts.category) txns = txns.filter(t => t.category === opts.category);
  if (opts.from) txns = txns.filter(t => t.date >= opts.from);
  if (opts.to) txns = txns.filter(t => t.date <= opts.to);
  const totalIncome = txns.filter(t=>t.type==='credit').reduce((s,t)=>s+t.amount,0);
  const totalExpenses = txns.filter(t=>t.type==='debit').reduce((s,t)=>s+t.amount,0);
  const categoryTotals = {};
  txns.filter(t=>t.type==='debit').forEach(t => { categoryTotals[t.category] = (categoryTotals[t.category]||0) + t.amount; });
  const dates = txns.map(t=>t.date).sort();
  const periodStart = dates[0] || null, periodEnd = dates[dates.length-1] || null;
  let avgDailySpend = 0, avgMonthlySpend = 0;
  if (periodStart && periodEnd) {
    const days = Math.max(1, Math.round((new Date(periodEnd)-new Date(periodStart))/86400000)+1);
    avgDailySpend = totalExpenses/days; avgMonthlySpend = avgDailySpend*30;
  }
  return { totalIncome, totalExpenses, netCashFlow: totalIncome-totalExpenses, categoryTotals,
    avgDailySpend: Math.round(avgDailySpend*100)/100, avgMonthlySpend: Math.round(avgMonthlySpend*100)/100,
    periodStart, periodEnd, transactionCount: txns.length };
}
function analyzeCurrentMonth(transactions) {
  const now = new Date();
  const from = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
  return analyzeTransactions(transactions, { from });
}
function analyzePreviousMonth(transactions) {
  const now = new Date();
  const prev = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const from = `${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}-01`;
  const lastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
  const to = `${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  return analyzeTransactions(transactions, { from, to });
}

// ═════════════════════════════════════════════════════════════════
// TOOL 9 — Behavioral Spending Insights (measurable patterns only)
// ═════════════════════════════════════════════════════════════════
function sanitizeTransactionContext(value) {
  return String(value || '').trim().slice(0, 240);
}
function analyzeBehavior(transactions) {
  const debits = transactions.filter(t => t.type === 'debit');
  if (!debits.length) return { transactionCount:0, indicators:[], contextCount:0, summary:'Add transactions to see measurable spending patterns.' };
  const total = debits.reduce((s,t)=>s+t.amount,0);
  const byCategory = {}, byMerchant = {}, byDay = {};
  debits.forEach(t => {
    byCategory[t.category] = (byCategory[t.category] || 0) + t.amount;
    const merchant = (t.merchant || t.description).trim().toLowerCase();
    byMerchant[merchant] = (byMerchant[merchant] || 0) + t.amount;
    const day = new Date(t.date).getDay();
    byDay[day] = (byDay[day] || 0) + t.amount;
  });
  const indicators = [];
  const topCategory = Object.entries(byCategory).sort((a,b)=>b[1]-a[1])[0];
  if (topCategory && total > 0 && topCategory[1] / total >= 0.35) {
    indicators.push({ id:'category-concentration', label:'Category concentration', value:`${Math.round(topCategory[1]/total*100)}%`, detail:`${topCategory[0]} accounts for the largest share of recorded debit spend.`, kind:'neutral' });
  }
  const small = debits.filter(t => t.amount <= 500);
  if (small.length >= 5) {
    indicators.push({ id:'small-purchase-frequency', label:'Small-purchase frequency', value:`${small.length}`, detail:`${small.length} recorded debits were ₹500 or less; together they total ${inr(small.reduce((s,t)=>s+t.amount,0))}.`, kind:'info' });
  }
  const weekendTotal = (byDay[0] || 0) + (byDay[6] || 0);
  if (total > 0 && weekendTotal / total >= 0.3) {
    indicators.push({ id:'weekend-share', label:'Weekend share', value:`${Math.round(weekendTotal/total*100)}%`, detail:`Recorded weekend debits account for ${Math.round(weekendTotal/total*100)}% of debit spend.`, kind:'info' });
  }
  const merchants = Object.entries(byMerchant).sort((a,b)=>b[1]-a[1]);
  if (merchants.length && total > 0 && merchants[0][1] / total >= 0.25) {
    indicators.push({ id:'merchant-concentration', label:'Merchant concentration', value:`${Math.round(merchants[0][1]/total*100)}%`, detail:`One merchant accounts for the largest share of recorded debit spend.`, kind:'neutral' });
  }
  const withContext = debits.filter(t => sanitizeTransactionContext(t.context)).length;
  if (withContext) indicators.push({ id:'context-coverage', label:'Context coverage', value:`${Math.round(withContext/debits.length*100)}%`, detail:`${withContext} of ${debits.length} debit transactions include optional user-provided context.`, kind:'good' });
  const top = topCategory ? `Most recorded debit spend is in ${topCategory[0]} (${inr(topCategory[1])}, ${Math.round(topCategory[1]/total*100)}%).` : 'Recorded debit spend is spread across categories.';
  const contextNotes = debits.filter(t => sanitizeTransactionContext(t.context)).slice(-3).map(t => sanitizeTransactionContext(t.context));
  const actions = [];
  if (indicators.some(i => i.id === 'category-concentration')) actions.push('Compare the largest category with its budget before making the next purchase.');
  if (indicators.some(i => i.id === 'small-purchase-frequency')) actions.push('Review small purchases as a group rather than judging any single transaction.');
  if (indicators.some(i => i.id === 'weekend-share')) actions.push('Check weekend spend against your remaining weekly budget.');
  return { transactionCount:debits.length, totalDebits:total, indicators:indicators.slice(0,4), contextCount:withContext, contextNotes, actions, summary:top };
}
function generateBehaviorInsights(transactions) {
  const analysis = analyzeBehavior(transactions);
  return analysis.indicators.map(i => ({ ...i, createdAt:new Date().toISOString() }));
}

// ═════════════════════════════════════════════════════════════════
// TOOL 3 — Recurring Payment Detector
// ═════════════════════════════════════════════════════════════════
function detectRecurringPayments(transactions) {
  const debits = transactions.filter(t=>t.type==='debit');
  const groups = new Map();
  debits.forEach(t => {
    const key = (t.merchant || t.description).trim().toLowerCase();
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  });
  const results = [];
  groups.forEach((txns) => {
    if (txns.length < 2) return;
    const sorted = [...txns].sort((a,b)=>a.date.localeCompare(b.date));
    const amounts = sorted.map(t=>t.amount);
    const avgAmount = amounts.reduce((s,a)=>s+a,0)/amounts.length;
    const amountVariance = Math.max(...amounts) - Math.min(...amounts);
    const amountStable = amountVariance <= avgAmount * 0.12;
    const gaps = [];
    for (let i=1;i<sorted.length;i++) gaps.push(Math.round((new Date(sorted[i].date)-new Date(sorted[i-1].date))/86400000));
    const avgGap = gaps.reduce((s,g)=>s+g,0)/gaps.length;
    const gapConsistent = gaps.every(g => Math.abs(g-avgGap) <= 4);
    let frequency = 'irregular';
    if (avgGap>=5 && avgGap<=9) frequency='weekly';
    else if (avgGap>=27 && avgGap<=33) frequency='monthly';
    else if (avgGap>=350 && avgGap<=380) frequency='yearly';
    const volatile = new Set(['Food','Transport','Shopping','Entertainment']);
    const minOcc = volatile.has(sorted[0].category) ? 3 : 2;
    if (!amountStable || !gapConsistent || frequency==='irregular' || sorted.length < minOcc) return;
    const last = sorted[sorted.length-1];
    const nextExpected = new Date(last.date);
    if (frequency==='weekly') nextExpected.setDate(nextExpected.getDate()+7);
    if (frequency==='monthly') nextExpected.setDate(nextExpected.getDate()+30);
    if (frequency==='yearly') nextExpected.setFullYear(nextExpected.getFullYear()+1);
    results.push({ merchant: last.merchant || last.description, amount: Math.round(avgAmount), frequency,
      occurrences: sorted.length, lastDate: last.date, nextExpected: iso(nextExpected), category: last.category });
  });
  return results.sort((a,b)=>b.amount-a.amount);
}

// ═════════════════════════════════════════════════════════════════
// TOOL 4 — Anomaly Detector (Tukey fence, never narrower than default)
// ═════════════════════════════════════════════════════════════════
function percentileOf(sorted, p) {
  if (!sorted.length) return 0;
  const idx = p*(sorted.length-1), lo=Math.floor(idx), hi=Math.ceil(idx);
  if (lo===hi) return sorted[lo];
  return sorted[lo] + (sorted[hi]-sorted[lo])*(idx-lo);
}
function detectAnomalies(transactions) {
  const debits = transactions.filter(t=>t.type==='debit');
  const byCategory = new Map();
  debits.forEach(t => { if(!byCategory.has(t.category)) byCategory.set(t.category, []); byCategory.get(t.category).push(t.amount); });
  const anomalies = [];
  debits.forEach(t => {
    const observed = byCategory.get(t.category) || [];
    const defaultRange = TYPICAL_RANGE[t.category] || [0, Number.MAX_SAFE_INTEGER];
    let upperBound = defaultRange[1];
    if (observed.length >= 4) {
      const sorted = [...observed].sort((a,b)=>a-b);
      const q1 = percentileOf(sorted,0.25), q3 = percentileOf(sorted,0.75);
      const fence = q3 + 1.5*(q3-q1);
      upperBound = Math.max(defaultRange[1], fence);
    }
    if (t.amount > upperBound) {
      anomalies.push({ transactionId: t.id, description: t.description, amount: t.amount, category: t.category,
        typicalRange: [defaultRange[0], upperBound],
        message: `Unusual spending pattern detected: ₹${t.amount.toLocaleString('en-IN')} on "${t.description}" is notably higher than your typical ${t.category} spending (usually under ₹${Math.round(upperBound).toLocaleString('en-IN')}).` });
    }
  });
  return anomalies;
}

// ═════════════════════════════════════════════════════════════════
// TOOL 5 — Budget Analyzer
// ═════════════════════════════════════════════════════════════════
function analyzeBudget(transactions, profile) {
  const { categoryTotals } = analyzeCurrentMonth(transactions);
  const cats = new Set([...Object.keys(profile.categoryBudgets), ...Object.keys(categoryTotals)]);
  cats.delete('Income');
  const lines = [];
  cats.forEach(cat => {
    const budget = profile.categoryBudgets[cat] || 0;
    const actual = categoryTotals[cat] || 0;
    const diff = budget - actual;
    const pctUsed = budget>0 ? Math.round((actual/budget)*100) : (actual>0 ? 999 : 0);
    let status = 'under';
    if (pctUsed > 100) status = 'over'; else if (pctUsed >= 80) status = 'near';
    lines.push({ category: cat, budget, actual, diff, pctUsed, status });
  });
  return lines.sort((a,b)=>b.pctUsed-a.pctUsed);
}
function totalBudgetSummary(transactions, profile) {
  const { totalExpenses } = analyzeCurrentMonth(transactions);
  const remaining = profile.monthlyBudget - totalExpenses;
  const pctUsed = profile.monthlyBudget>0 ? Math.round((totalExpenses/profile.monthlyBudget)*100) : 0;
  return { budget: profile.monthlyBudget, actual: totalExpenses, remaining, pctUsed,
    status: pctUsed>100 ? 'over' : pctUsed>=80 ? 'near' : 'under' };
}

// ═════════════════════════════════════════════════════════════════
// TOOL 6 — Upcoming Obligation Analyzer
// ═════════════════════════════════════════════════════════════════
function analyzeObligations(recurring, lookaheadDays) {
  lookaheadDays = lookaheadDays === undefined ? 30 : lookaheadDays;
  const today = new Date(); today.setHours(0,0,0,0);
  return recurring.map(r => {
    const due = new Date(r.nextExpected);
    const daysRemaining = Math.round((due-today)/86400000);
    let status = 'upcoming';
    if (daysRemaining < 0) status = 'overdue'; else if (daysRemaining <= 5) status = 'due-soon';
    return { id:`obl-${r.merchant}-${r.nextExpected}`, name:r.merchant, amount:r.amount, dueDate:r.nextExpected, daysRemaining, status, source:'recurring' };
  }).filter(o => o.daysRemaining <= lookaheadDays).sort((a,b)=>a.daysRemaining-b.daysRemaining);
}
function totalUpcomingAmount(obligations) { return obligations.reduce((s,o)=>s+o.amount,0); }

// ═════════════════════════════════════════════════════════════════
// TOOL 7 — Goal Progress Calculator
// ═════════════════════════════════════════════════════════════════
function calculateGoalProgress(transactions, profile) {
  if (!profile.goal) return null;
  const { name, amount, deadlineMonths, savedSoFar } = profile.goal;
  const remaining = Math.max(0, amount - savedSoFar);
  const requiredMonthlySaving = deadlineMonths>0 ? Math.round(remaining/deadlineMonths) : remaining;
  const { totalIncome, totalExpenses } = analyzeCurrentMonth(transactions);
  const currentMonthNetSaving = (totalIncome>0 || totalExpenses>0) ? totalIncome-totalExpenses : profile.income-profile.monthlyBudget;
  const gapPerMonth = requiredMonthlySaving - currentMonthNetSaving;
  return { goalName:name, targetAmount:amount, savedSoFar, progressPct: amount>0?Math.round((savedSoFar/amount)*100):0,
    monthsRemaining:deadlineMonths, requiredMonthlySaving, currentMonthNetSaving:Math.round(currentMonthNetSaving),
    onTrack: currentMonthNetSaving >= requiredMonthlySaving, gapPerMonth: Math.round(gapPerMonth) };
}

// ═════════════════════════════════════════════════════════════════
// TOOL 8 — Spending Impact Calculator
// ═════════════════════════════════════════════════════════════════
function calculateSpendingImpact(proposedAmount, transactions, profile, obligations) {
  const budgetSummary = totalBudgetSummary(transactions, profile);
  const remainingBudgetBefore = budgetSummary.remaining;
  const remainingBudgetAfter = remainingBudgetBefore - proposedAmount;
  const availableCashBefore = profile.balance;
  const availableCashAfter = availableCashBefore - proposedAmount;
  const upcomingObligationsTotal = totalUpcomingAmount(obligations);
  const cashLeftAfterObligations = availableCashAfter - upcomingObligationsTotal;
  const goalBefore = calculateGoalProgress(transactions, profile);
  const hypotheticalTxn = { id:'hypothetical', date: iso(new Date()), description:'Proposed expense (hypothetical)', amount:proposedAmount, type:'debit', category:'Other', categoryConfidence:1, categoryReason:'Hypothetical spending-impact simulation.' };
  const goalAfter = goalBefore ? calculateGoalProgress([...transactions, hypotheticalTxn], profile) : null;
  const wouldExceedBudget = remainingBudgetAfter < 0;
  const wouldBreakObligations = cashLeftAfterObligations < 0;
  const wouldMissGoalPace = !!goalAfter && goalAfter.gapPerMonth > (goalBefore ? goalBefore.gapPerMonth : 0);
  let verdict = 'affordable';
  if (wouldBreakObligations || wouldExceedBudget) verdict = 'risky';
  else if (wouldMissGoalPace || remainingBudgetAfter < remainingBudgetBefore*0.15) verdict = 'tight';
  return { proposedAmount, remainingBudgetBefore, remainingBudgetAfter, availableCashBefore, availableCashAfter,
    upcomingObligationsTotal, cashLeftAfterObligations,
    projectedSavingsBefore: goalBefore ? goalBefore.currentMonthNetSaving : null,
    projectedSavingsAfter: goalAfter ? goalAfter.currentMonthNetSaving - proposedAmount : null,
    requiredMonthlySaving: goalBefore ? goalBefore.requiredMonthlySaving : null,
    wouldExceedBudget, wouldBreakObligations, wouldMissGoalPace, verdict };
}

// ═════════════════════════════════════════════════════════════════
// Insight generator (combines tools for the dashboard AI Insights panel)
// ═════════════════════════════════════════════════════════════════
function generateInsights(transactions, profile) {
  const insights = []; const now = new Date().toISOString();
  const current = analyzeCurrentMonth(transactions), previous = analyzePreviousMonth(transactions);
  if (previous.transactionCount > 0) {
    ['Shopping','Food','Entertainment','Travel'].forEach(cat => {
      const curAmt = current.categoryTotals[cat]||0, prevAmt = previous.categoryTotals[cat]||0;
      if (prevAmt>0 && curAmt>0) {
        const change = Math.round(((curAmt-prevAmt)/prevAmt)*100);
        if (Math.abs(change) >= 20) insights.push({ id:nextId('insight'), text:`${cat} spending ${change>0?'increased':'decreased'} ${Math.abs(change)}% compared with last month (${inr(prevAmt)} → ${inr(curAmt)}).`, kind: change>0?'warning':'positive', createdAt:now });
      }
    });
  }
  const recurring = detectRecurringPayments(transactions);
  const subTotal = recurring.filter(r=>r.category==='Subscriptions').reduce((s,r)=>s+r.amount,0);
  if (subTotal>0) insights.push({ id:nextId('insight'), text:`${inr(subTotal)} in recurring subscriptions detected across ${recurring.filter(r=>r.category==='Subscriptions').length} services.`, kind:'neutral', createdAt:now });
  const obligations = analyzeObligations(recurring, 7);
  const soon = obligations.filter(o=>o.status==='due-soon'||o.status==='overdue');
  if (soon.length) { const nearest = soon[0]; insights.push({ id:nextId('insight'), text:`Your ${nearest.name} payment of ${inr(nearest.amount)} is ${relativeDays(nearest.daysRemaining)}.`, kind: nearest.status==='overdue'?'warning':'neutral', createdAt:now }); }
  const budgetLines = analyzeBudget(transactions, profile);
  const overBudget = budgetLines.filter(b=>b.status==='over');
  if (overBudget.length) insights.push({ id:nextId('insight'), text:`You're over budget in ${overBudget.length} categor${overBudget.length>1?'ies':'y'}: ${overBudget.map(b=>`${b.category} (${pct(b.pctUsed)})`).join(', ')}.`, kind:'warning', createdAt:now });
  const anomalies = detectAnomalies(transactions);
  if (anomalies.length) { const top = [...anomalies].sort((a,b)=>b.amount-a.amount)[0]; insights.push({ id:nextId('insight'), text:`${anomalies.length} unusual spending pattern${anomalies.length>1?'s':''} detected — largest was ${inr(top.amount)} on ${top.description}.`, kind:'warning', createdAt:now }); }
  const goal = calculateGoalProgress(transactions, profile);
  if (goal) insights.push({ id:nextId('insight'), text: goal.onTrack ? `You're on track for "${goal.goalName}" — projected net saving of ${inr(goal.currentMonthNetSaving)} meets the ${inr(goal.requiredMonthlySaving)}/month pace needed.` : `Projected savings pace is ${inr(Math.abs(goal.gapPerMonth))} short of what "${goal.goalName}" needs per month to stay on schedule.`, kind: goal.onTrack?'positive':'warning', createdAt:now });
  return insights.slice(0,5);
}

<script type="text/babel" data-presets="react">

// ═════════════════════════════════════════════════════════════════
// DATA LAYER — CSV parsing & validation
// ═════════════════════════════════════════════════════════════════
function normalizeHeader(h) { return h.trim().toLowerCase(); }
function findKey(row, candidates) {
  const keys = Object.keys(row);
  for (const c of candidates) { const m = keys.find(k => normalizeHeader(k)===c); if (m) return m; }
  return null;
}
function parseDateStr(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return null;
  const m = trimmed.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})$/);
  if (m) {
    const [, d, mo, y] = m;
    const year = y.length===2 ? `20${y}` : y;
    const dayNum = parseInt(d,10), monthNum = parseInt(mo,10);
    if (monthNum>=1 && monthNum<=12 && dayNum>=1 && dayNum<=31) {
      const c = new Date(`${year}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`);
      if (!isNaN(c.getTime())) return iso(c);
    }
  }
  const native = new Date(trimmed);
  if (!isNaN(native.getTime())) return iso(native);
  return null;
}
function parseAmountAndType(raw, explicitType) {
  const cleaned = raw.replace(/[₹,\s]/g,''); const num = parseFloat(cleaned);
  if (isNaN(num)) return null;
  if (explicitType) {
    const t = explicitType.trim().toLowerCase();
    if (t.startsWith('cr') || t==='credit' || t==='income') return { amount: Math.abs(num), type:'credit' };
    if (t.startsWith('de') || t==='debit' || t==='expense') return { amount: Math.abs(num), type:'debit' };
  }
  return num < 0 ? { amount: Math.abs(num), type:'debit' } : { amount: Math.abs(num), type:'credit' };
}
function parseTransactionsCsv(csvText) {
  const errors = [];
  const result = Papa.parse(csvText, { header:true, skipEmptyLines:true });
  if (result.errors.length) result.errors.forEach(e => errors.push({ row:(e.row||0)+2, message:e.message }));
  const rows = result.data;
  if (!rows.length) return { transactions:[], errors:[{row:0,message:'The file has no data rows.'}], duplicatesSkipped:0, rowsRead:0 };
  const first = rows[0];
  const dateKey = findKey(first, ['date','transaction date','txn date']);
  const descKey = findKey(first, ['description','narration','details','particulars']);
  const amountKey = findKey(first, ['amount','value','txn amount']);
  const typeKey = findKey(first, ['type','transaction type','dr/cr']);
  const merchantKey = findKey(first, ['merchant','payee']);
  const categoryKey = findKey(first, ['category']);
  const contextKey = findKey(first, ['context','user context','transaction context','note','notes']);
  if (!dateKey || !descKey || !amountKey) {
    const missing = [!dateKey&&'date', !descKey&&'description', !amountKey&&'amount'].filter(Boolean);
    return { transactions:[], errors:[{row:0,message:`Missing required column(s): ${missing.join(', ')}. Expected headers like Date, Description, Amount.`}], duplicatesSkipped:0, rowsRead:rows.length };
  }
  const transactions = []; const seen = new Set(); let duplicatesSkipped = 0;
  rows.forEach((row, idx) => {
    const rowNum = idx+2;
    const rawDate = row[dateKey]||'', rawDesc = (row[descKey]||'').trim(), rawAmount = row[amountKey]||'';
    const date = parseDateStr(rawDate);
    if (!date) { errors.push({row:rowNum, message:`Invalid or unrecognized date: "${rawDate}"`}); return; }
    if (!rawDesc) { errors.push({row:rowNum, message:'Missing transaction description.'}); return; }
    const parsedAmount = parseAmountAndType(rawAmount, typeKey ? row[typeKey] : undefined);
    if (!parsedAmount) { errors.push({row:rowNum, message:`Invalid amount: "${rawAmount}"`}); return; }
    if (parsedAmount.amount === 0) { errors.push({row:rowNum, message:'Amount is zero — skipped.'}); return; }
    const dedupeKey = `${date}|${rawDesc.toLowerCase()}|${parsedAmount.amount}|${parsedAmount.type}`;
    if (seen.has(dedupeKey)) { duplicatesSkipped += 1; return; }
    seen.add(dedupeKey);
    const merchant = merchantKey ? (row[merchantKey]||'').trim() : undefined;
    const presetCategory = categoryKey ? (row[categoryKey]||'').trim() : undefined;
    const cat = presetCategory ? { category: presetCategory, confidence:1, reason:'Provided in source file.' } : categorizeTransaction(rawDesc, merchant, parsedAmount.type);
    transactions.push({ id: nextId('csv'), date, description: rawDesc, amount: parsedAmount.amount, type: parsedAmount.type,
      merchant, context: sanitizeTransactionContext(contextKey ? row[contextKey] : ''), category: cat.category, categoryConfidence: cat.confidence, categoryReason: cat.reason });
  });
  return { transactions, errors, duplicatesSkipped, rowsRead: rows.length };
}

// ═════════════════════════════════════════════════════════════════
// AGENT — intent classifier (rule-based NLU)
// ═════════════════════════════════════════════════════════════════
const CATEGORY_WORDS = ['food','shopping','transport','bills','rent','entertainment','healthcare','education','subscriptions','travel'];
function classifyIntent(question) {
  const q = question.toLowerCase();
  const matches = [];
  const amountMatch = q.match(/(?:₹|rs\.?|inr)?\s?([\d,]+(?:\.\d+)?)\s?(?:rupees|₹)?/i);
  const extractedAmount = amountMatch ? parseFloat(amountMatch[1].replace(/,/g,'')) : undefined;
  if (/can i (spend|afford)|should i spend|is it okay to spend|afford to spend/.test(q) && extractedAmount) matches.push({ intent:'can_i_spend', confidence:0.95, extractedAmount });
  if (/what happens (to|if)|impact (on|of)|if i spend/.test(q) && extractedAmount) matches.push({ intent:'can_i_spend', confidence:0.9, extractedAmount });
  if (/subscription|recurring|netflix|spotify|gym/.test(q)) matches.push({ intent:'subscriptions', confidence:0.9 });
  if (/bill|due|upcoming|obligation|payment coming/.test(q)) matches.push({ intent:'upcoming_bills', confidence:0.85 });
  if (/goal|on track|saving target|save.*(month|deadline)/.test(q)) matches.push({ intent:'goal_progress', confidence:0.85 });
  if (/overspend|over budget|where.*(spending too much|overspending)/.test(q)) matches.push({ intent:'overspending', confidence:0.85 });
  if (/compare|last month|previous month|changed|vs\.?|versus/.test(q)) matches.push({ intent:'month_comparison', confidence:0.8 });
  if (/review|unusual|flag|anomal|suspicious|weird/.test(q)) matches.push({ intent:'review_expenses', confidence:0.8 });
  if (/behavior|pattern|habit|frequent|small purchase|weekend spending|spending mix/.test(q)) matches.push({ intent:'behavioral_patterns', confidence:0.85 });
  const category = CATEGORY_WORDS.find(c => q.includes(c));
  if (category && /spen[dt]|cost|paid|expense/.test(q)) matches.push({ intent:'category_spend', confidence:0.85, extractedCategory: category.charAt(0).toUpperCase()+category.slice(1) });
  if (!matches.length) matches.push({ intent:'general_summary', confidence:0.5, extractedAmount });
  return matches.sort((a,b)=>b.confidence-a.confidence);
}

// ═════════════════════════════════════════════════════════════════
// AGENT ORCHESTRATOR — the core agent loop
// ═════════════════════════════════════════════════════════════════
const TOOL_LABELS = {
  TransactionAnalyzer:'Analyzing your transactions', RecurringDetector:'Checking recurring payments',
  AnomalyDetector:'Scanning for unusual spending', BudgetAnalyzer:'Comparing spending against your budget',
  ObligationAnalyzer:'Checking upcoming obligations', GoalCalculator:'Calculating goal impact', ImpactCalculator:'Simulating spending impact',
  BehavioralAnalyzer:'Measuring spending patterns',
};
const INTENT_TOOLS = {
  category_spend:['TransactionAnalyzer'], subscriptions:['RecurringDetector'], upcoming_bills:['ObligationAnalyzer'],
  goal_progress:['TransactionAnalyzer','GoalCalculator'],
  can_i_spend:['BudgetAnalyzer','ObligationAnalyzer','GoalCalculator','ImpactCalculator'],
  overspending:['BudgetAnalyzer','AnomalyDetector'], month_comparison:['TransactionAnalyzer'],
  review_expenses:['AnomalyDetector','BudgetAnalyzer'], behavioral_patterns:['BehavioralAnalyzer'],
  general_summary:['TransactionAnalyzer','BudgetAnalyzer','ObligationAnalyzer','BehavioralAnalyzer'],
};
function buildSteps(tools) {
  return [{id:'understand',label:'Understanding request',status:'pending'},
    {id:'context',label:'Checking financial context',status:'pending'},
    ...tools.map(t => ({id:t, label:TOOL_LABELS[t]||t, status:'pending'})),
    {id:'generate',label:'Generating recommendation',status:'pending'}];
}
function delay(ms) { return new Promise(r=>setTimeout(r,ms)); }

async function runAgent(question, state, onStep) {
  const matches = classifyIntent(question);
  const primary = matches.filter(m=>m.confidence>=0.7).map(m=>m.intent);
  const intents = primary.length ? primary : [matches[0].intent];
  const toolSet = new Set(); intents.forEach(i => INTENT_TOOLS[i].forEach(t=>toolSet.add(t)));
  const tools = Array.from(toolSet);
  const steps = buildSteps(tools);
  const setStep = (id, status) => { const s = steps.find(x=>x.id===id); if (s) s.status = status; onStep && onStep(steps.map(s=>({...s}))); };

  setStep('understand','active'); await delay(220); setStep('understand','done');
  setStep('context','active'); await delay(180); setStep('context','done');

  const toolResults = {};
  for (const tool of tools) {
    setStep(tool,'active'); await delay(260);
    if (tool==='TransactionAnalyzer') {
      const category = matches.find(m=>m.extractedCategory) ? matches.find(m=>m.extractedCategory).extractedCategory : undefined;
      toolResults.transactionAnalysis = category ? analyzeTransactions(state.transactions,{category}) : analyzeCurrentMonth(state.transactions);
      if (intents.includes('month_comparison')) {
        toolResults.currentMonth = analyzeCurrentMonth(state.transactions);
        toolResults.previousMonth = analyzePreviousMonth(state.transactions);
      }
    } else if (tool==='RecurringDetector') {
      toolResults.recurring = detectRecurringPayments(state.transactions);
    } else if (tool==='AnomalyDetector') {
      toolResults.anomalies = detectAnomalies(state.transactions);
    } else if (tool==='BudgetAnalyzer') {
      toolResults.budgetLines = analyzeBudget(state.transactions, state.profile);
      toolResults.budgetSummary = totalBudgetSummary(state.transactions, state.profile);
    } else if (tool==='ObligationAnalyzer') {
      const recurring = toolResults.recurring || detectRecurringPayments(state.transactions);
      toolResults.obligations = analyzeObligations(recurring);
    } else if (tool==='GoalCalculator') {
      toolResults.goalProgress = calculateGoalProgress(state.transactions, state.profile);
    } else if (tool==='ImpactCalculator') {
      const amount = matches.find(m=>m.extractedAmount) ? matches.find(m=>m.extractedAmount).extractedAmount : 0;
      const recurring = toolResults.recurring || detectRecurringPayments(state.transactions);
      const obligations = toolResults.obligations || analyzeObligations(recurring);
      toolResults.spendingImpact = calculateSpendingImpact(amount, state.transactions, state.profile, obligations);
    } else if (tool==='BehavioralAnalyzer') {
      toolResults.behavior = analyzeBehavior(state.transactions);
    }
    setStep(tool,'done');
  }

  setStep('generate','active');
  const answer = composeTemplateAnswer(intents, toolResults, state, matches);
  await delay(140);
  setStep('generate','done');

  return { id:`turn-${Date.now()}`, question, intents, toolsUsed: tools, activitySteps: steps, answer, toolResults, timestamp: new Date().toISOString() };
}

function composeTemplateAnswer(intents, results, state, matches) {
  const parts = [];
  if (intents.includes('can_i_spend')) {
    const impact = results.spendingImpact;
    if (!impact || impact.proposedAmount <= 0) return "I couldn't find an amount in your question. Try asking, for example, \"Can I spend ₹5,000 this month?\"";
    const amt = inr(impact.proposedAmount);
    if (impact.verdict === 'affordable') {
      parts.push(`Based on the financial information currently available, spending ${amt} looks affordable this month. Your remaining budget would go from ${inr(impact.remainingBudgetBefore)} to ${inr(impact.remainingBudgetAfter)}, and after your upcoming obligations of ${inr(impact.upcomingObligationsTotal)} you'd still have ${inr(impact.cashLeftAfterObligations)} in hand.`);
    } else if (impact.verdict === 'tight') {
      parts.push(`Spending ${amt} is possible, but it would be tight. Your remaining budget would drop to ${inr(impact.remainingBudgetAfter)}, leaving ${inr(impact.cashLeftAfterObligations)} after your ${inr(impact.upcomingObligationsTotal)} in upcoming obligations.`);
      if (impact.wouldMissGoalPace && impact.requiredMonthlySaving != null) parts.push(`It would also slow progress toward your savings goal, which currently needs about ${inr(impact.requiredMonthlySaving)}/month to stay on schedule.`);
    } else {
      parts.push(`Based on your recorded spending, ${amt} would put you at risk this month. ` +
        (impact.wouldExceedBudget ? `It would exceed your remaining budget of ${inr(impact.remainingBudgetBefore)} by ${inr(Math.abs(impact.remainingBudgetAfter))}. ` : '') +
        (impact.wouldBreakObligations ? `After accounting for ${inr(impact.upcomingObligationsTotal)} in upcoming obligations, you'd be short by ${inr(Math.abs(impact.cashLeftAfterObligations))}. ` : ''));
      parts.push('Consider reviewing this expense or postponing part of it until your next income cycle.');
    }
    return parts.join(' ');
  }
  if (intents.includes('subscriptions')) {
    const recurring = results.recurring;
    if (!recurring || !recurring.length) return "I didn't detect any recurring subscriptions in your uploaded transactions yet. Upload more transaction history and I'll check again.";
    const total = recurring.reduce((s,r)=>s+r.amount,0);
    const list = recurring.map(r=>`${r.merchant} (${inr(r.amount)}/${r.frequency.replace('ly','')})`).join(', ');
    return `You have ${recurring.length} recurring payment${recurring.length>1?'s':''} totaling ${inr(total)} per cycle: ${list}.`;
  }
  if (intents.includes('upcoming_bills')) {
    const obligations = results.obligations;
    if (!obligations || !obligations.length) return 'You have no upcoming obligations detected in the next 30 days based on your recorded recurring payments.';
    const total = totalUpcomingAmount(obligations);
    const list = obligations.map(o=>`${o.name} — ${inr(o.amount)} (${relativeDays(o.daysRemaining)})`).join('; ');
    return `You have ${obligations.length} obligation${obligations.length>1?'s':''} coming up, totaling ${inr(total)}: ${list}.`;
  }
  if (intents.includes('goal_progress')) {
    const goal = results.goalProgress;
    if (!goal) return "You haven't set a savings goal yet. Add one in onboarding and I'll track your progress toward it.";
    const status = goal.onTrack
      ? `Based on this month's numbers, you're on track — your projected net saving of ${inr(goal.currentMonthNetSaving)} meets the ${inr(goal.requiredMonthlySaving)}/month pace needed.`
      : `Based on this month's numbers, you're currently behind pace. You'd need roughly ${inr(goal.requiredMonthlySaving)}/month to reach your goal on time, but this month's projected net saving is ${inr(goal.currentMonthNetSaving)} — a gap of about ${inr(Math.abs(goal.gapPerMonth))}.`;
    return `Toward "${goal.goalName}" (${inr(goal.savedSoFar)} of ${inr(goal.targetAmount)} saved, ${pct(goal.progressPct)} of the way there): ${status}`;
  }
  if (intents.includes('overspending')) {
    const budgetLines = results.budgetLines, anomalies = results.anomalies;
    const overCats = (budgetLines||[]).filter(b=>b.status==='over');
    const bits = [];
    bits.push(overCats.length ? `Your recorded spending suggests you're over budget in ${overCats.map(c=>`${c.category} (${pct(c.pctUsed)} of ${inr(c.budget)} used)`).join(', ')}.` : "You're not over budget in any category this month based on current data.");
    if (anomalies && anomalies.length) bits.push(`I also flagged ${anomalies.length} unusual transaction${anomalies.length>1?'s':''}: ${anomalies.map(a=>a.description).join(', ')}.`);
    return bits.join(' ');
  }
  if (intents.includes('month_comparison')) {
    const current = results.currentMonth, previous = results.previousMonth;
    if (!current || !previous || !previous.transactionCount) return "I don't have enough previous-month data to compare yet. Upload more transaction history for a month-over-month comparison.";
    const diff = current.totalExpenses - previous.totalExpenses;
    const direction = diff>0 ? 'higher':'lower';
    const pctChange = previous.totalExpenses>0 ? Math.abs(Math.round((diff/previous.totalExpenses)*100)) : 0;
    return `Your spending this month is ${inr(Math.abs(diff))} ${direction} than last month (${pctChange}% ${direction}) — ${inr(current.totalExpenses)} vs ${inr(previous.totalExpenses)} previously. Net cash flow this month is ${inr(current.netCashFlow)}, compared with ${inr(previous.netCashFlow)} last month.`;
  }
  if (intents.includes('review_expenses')) {
    const anomalies = results.anomalies;
    if (!anomalies || !anomalies.length) return 'Nothing stands out — I did not detect any unusual spending patterns in your recorded transactions.';
    return `I'd suggest reviewing ${anomalies.length} transaction${anomalies.length>1?'s':''}: ${anomalies.map(a=>a.message).join(' ')}`;
  }
  if (intents.includes('behavioral_patterns')) {
    const behavior = results.behavior || analyzeBehavior(state.transactions);
    if (!behavior.transactionCount) return behavior.summary;
    const indicators = behavior.indicators.map(i=>`${i.label}: ${i.detail}`).join(' ');
    const context = behavior.contextNotes && behavior.contextNotes.length ? ` User-provided context available for comparison includes: ${behavior.contextNotes.join('; ')}.` : '';
    const action = behavior.actions && behavior.actions.length ? ` Decision support: ${behavior.actions[0]}` : '';
    return `${behavior.summary} ${indicators || 'No strong measurable pattern crossed the current thresholds.'}${context}${action} These are descriptive signals from recorded transactions, not conclusions about how you felt or why you spent.`;
  }
  if (intents.includes('category_spend')) {
    const analysis = results.transactionAnalysis;
    const category = matches.find(m=>m.extractedCategory) ? matches.find(m=>m.extractedCategory).extractedCategory : undefined;
    if (!analysis || !analysis.transactionCount) return `I couldn't find any transactions${category?` in ${category}`:''} in your uploaded data.`;
    return `You've spent ${inr(analysis.totalExpenses)} on ${category||'this category'} across ${analysis.transactionCount} transaction${analysis.transactionCount>1?'s':''}, averaging ${inr(analysis.avgMonthlySpend)}/month at the current pace.`;
  }
  const analysis = results.transactionAnalysis, budgetSummary = results.budgetSummary, obligations = results.obligations;
  if (!state.transactions.length) return "I don't have any transaction data yet. Upload a CSV or load the demo dataset so I can analyze your finances.";
  const bits = [
    analysis ? `This month you've spent ${inr(analysis.totalExpenses)} against income of ${inr(analysis.totalIncome)}.` : '',
    budgetSummary ? `That's ${pct(budgetSummary.pctUsed)} of your ${inr(budgetSummary.budget)} monthly budget, with ${inr(Math.max(0,budgetSummary.remaining))} remaining.` : '',
    obligations && obligations.length ? `You have ${obligations.length} upcoming obligation${obligations.length>1?'s':''} totaling ${inr(totalUpcomingAmount(obligations))}.` : '',
    results.behavior ? results.behavior.summary : '',
  ].filter(Boolean);
  return bits.join(' ') || "Ask me about your spending, subscriptions, bills, or savings goal and I'll analyze your data.";
}

<script type="text/babel" data-presets="react">

// ═════════════════════════════════════════════════════════════════
// STATE — reducer-based financial state with before/after snapshots
// ═════════════════════════════════════════════════════════════════
const STORAGE_KEY = 'finora-state-v1';
const AUTH_KEY = 'finora-auth-v1';
const DEMO_EMAIL = 'demo@finora.app';
const DEMO_PASSWORD = 'finora123';

const EMPTY_PROFILE = { income:0, balance:0, monthlyBudget:0, categoryBudgets:{}, goal:null };
const initialState = { onboarded:false, profile: EMPTY_PROFILE, transactions:[], recurring:[], obligations:[], budgets:[], anomalies:[], insights:[], behaviorInsights:[], history:[], snapshots:[], lastUpdated:null };

function snapshotOf(state, label) {
  const summary = totalBudgetSummary(state.transactions, state.profile);
  const goal = calculateGoalProgress(state.transactions, state.profile);
  return { label, timestamp:new Date().toISOString(), totalExpenses:summary.actual,
    netCashFlow: state.profile.income - summary.actual,
    projectedSavings: goal ? goal.currentMonthNetSaving : state.profile.income - summary.actual,
    remainingBudget: summary.remaining };
}
function recompute(state) {
  const recurring = detectRecurringPayments(state.transactions);
  const anomalies = detectAnomalies(state.transactions);
  const budgets = analyzeBudget(state.transactions, state.profile);
  const obligations = analyzeObligations(recurring);
  const insights = generateInsights(state.transactions, state.profile);
  const behaviorInsights = generateBehaviorInsights(state.transactions);
  return { ...state, recurring, anomalies, budgets, obligations, insights, behaviorInsights, lastUpdated: new Date().toISOString() };
}
function reducer(state, action) {
  switch (action.type) {
    // Generic "set profile + a batch of transactions" used by every data
    // source (demo data, simulated email sync, or a fresh manual profile
    // with no transactions yet ahead of a CSV upload).
    case 'SETUP': {
      const next = recompute({ ...state, profile: action.profile, transactions: action.transactions, onboarded:true });
      return { ...next, snapshots:[snapshotOf(next, action.label)] };
    }
    case 'ADD_TRANSACTIONS': {
      const merged = [...state.transactions, ...action.transactions];
      const next = recompute({ ...state, transactions: merged });
      return { ...next, snapshots:[...next.snapshots, snapshotOf(next, action.label)] };
    }
    case 'ADD_UNEXPECTED_EXPENSE': {
      const raw = unexpectedExpenseTransaction();
      const c = categorizeTransaction(raw.description, raw.merchant, raw.type);
      const txn = { ...raw, category:c.category, categoryConfidence:c.confidence, categoryReason:c.reason };
      const merged = [...state.transactions, txn];
      const next = recompute({ ...state, transactions: merged });
      return { ...next, snapshots:[...next.snapshots, snapshotOf(next,'Unexpected ₹4,000 expense added')] };
    }
    case 'RECORD_TURN': return { ...state, history:[...state.history, action.turn] };
    case 'RESET': return initialState;
    default: return state;
  }
}

const FinanceContext = createContext(null);
function FinanceProvider({ children }) {
  const [state, dispatch] = useReducer(reducer, initialState, (init) => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && parsed.onboarded) return { ...parsed, behaviorInsights: parsed.behaviorInsights || generateBehaviorInsights(parsed.transactions || []) };
      }
    } catch (e) { /* ignore corrupt storage */ }
    return init;
  });

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }, [state]);

  const setupWithSource = useCallback((profile, transactions, label) => dispatch({type:'SETUP', profile, transactions, label}), []);
  const addTransactions = useCallback((transactions,label) => dispatch({type:'ADD_TRANSACTIONS', transactions, label}), []);
  const addUnexpectedExpense = useCallback(() => dispatch({type:'ADD_UNEXPECTED_EXPENSE'}), []);
  const recordTurn = useCallback((turn) => dispatch({type:'RECORD_TURN', turn}), []);
  const resetData = useCallback(() => { try { localStorage.removeItem(STORAGE_KEY); } catch(e){} dispatch({type:'RESET'}); }, []);

  const value = useMemo(() => ({ state, setupWithSource, addTransactions, addUnexpectedExpense, recordTurn, resetData }),
    [state, setupWithSource, addTransactions, addUnexpectedExpense, recordTurn, resetData]);
  return <FinanceContext.Provider value={value}>{children}</FinanceContext.Provider>;
}
function useFinance() { const ctx = useContext(FinanceContext); if (!ctx) throw new Error('useFinance must be used within FinanceProvider'); return ctx; }

// ─── Auth (demo-only, no real backend) ───────────────────────────
function useAuth() {
  const [user, setUser] = useState(() => {
    try { const saved = localStorage.getItem(AUTH_KEY); return saved ? JSON.parse(saved) : null; }
    catch (e) { return null; }
  });
  const login = useCallback((email) => {
    const u = { email, loggedInAt: new Date().toISOString() };
    try { localStorage.setItem(AUTH_KEY, JSON.stringify(u)); } catch(e) {}
    setUser(u);
  }, []);
  const logout = useCallback(() => {
    try { localStorage.removeItem(AUTH_KEY); } catch(e) {}
    setUser(null);
  }, []);
  return { user, login, logout };
}
</script>

                  </button>
                </div>
              )}

          )}

          {source!=='scratch' && (
            <button onClick={()=>setShowCustomize(v=>!v)} className="w-full text-left text-xs text-ink-500 hover:text-ink-700 px-1 pt-1">
              {showCustomize ? '▾' : '▸'} Customize your income, budget & goal {source==='demo' ? '(not used with instant demo data)' : ''}
            </button>
          )}
          {showCustomize && (

              <div className="grid grid-cols-2 gap-3">

              <label className="flex items-center gap-2 text-xs text-ink-600 cursor-pointer">
                <input type="checkbox" checked={includeGoal} onChange={e=>setIncludeGoal(e.target.checked)} className="accent-brand-500" /> Set a savings goal
              </label>
              {includeGoal && (
                <div className="space-y-3">
                  <ProfileField label="Goal name" value={goalName} onChange={setGoalName} type="text" />
                  <div className="grid grid-cols-2 gap-3">
                    <ProfileField label="Goal amount (₹)" value={goalAmount} onChange={setGoalAmount} type="number" />
                    <ProfileField label="Deadline (months)" value={goalMonths} onChange={setGoalMonths} type="number" />
                  </div>
                  <ProfileField label="Already saved (₹)" value={savedSoFar} onChange={setSavedSoFar} type="number" />
                </div>
              )}
              {source==='scratch' && (
                <button disabled={!canCreateScratch} onClick={startScratch}
                  className="w-full rounded-lg bg-brand-500 hover:bg-brand-600 disabled:opacity-40 disabled:cursor-not-allowed transition-colors text-white font-semibold text-sm py-2.5 mt-1">
                  Create my profile & start with zero transactions
                </button>
              )}
              {source==='scratch' && !canCreateScratch && (
                <p className="text-[11px] text-ink-400 px-1">Enter at least your monthly income and budget to continue.</p>
              )}
            </div>
          )}
        </div>

        <p className="text-center text-[11px] text-ink-400 mt-4">Finora is decision-support software, not a financial advisor or investment product.</p>
      </div>
    </div>
  );
}

<script type="text/babel" data-presets="react">

// ═════════════════════════════════════════════════════════════════
// COMPONENT — Snapshot banner (shows the agent's before/after re-evaluation)
// ═════════════════════════════════════════════════════════════════
function SnapshotBanner() {
  const { state } = useFinance();
  const [dismissedFor, setDismissedFor] = useState(null);
  const snapshots = state.snapshots;
  const latest = snapshots[snapshots.length-1];
  const previous = snapshots.length >= 2 ? snapshots[snapshots.length-2] : null;
  const key = latest ? `${latest.label}-${latest.timestamp}` : null;
  const visible = !!previous && key !== dismissedFor;
  if (!visible || !previous || !latest) return null;
  const savingsDiff = latest.projectedSavings - previous.projectedSavings;
  const changed = Math.abs(savingsDiff) >= 1 || Math.abs(latest.remainingBudget - previous.remainingBudget) >= 1;
  if (!changed) return null;
  return (
    <div className="fade-in border-b border-brand-100 bg-brand-50 px-6 py-3 flex items-center justify-between gap-4">
      <div className="flex items-center gap-3 text-sm">
        <span className="flex h-2 w-2 rounded-full bg-brand-500 pulse-dot shrink-0" />
        <span className="text-ink-700">
          <span className="text-brand-600 font-semibold">Finora re-evaluated</span> after "{latest.label}" — projected savings {savingsDiff<0?'dropped':'rose'} from <span className="num font-medium">{inr(previous.projectedSavings)}</span> to <span className="num font-medium">{inr(latest.projectedSavings)}</span>, remaining budget now <span className="num font-medium">{inr(latest.remainingBudget)}</span>.
        </span>
      </div>
      <button onClick={()=>setDismissedFor(key)} className="text-ink-400 hover:text-ink-700 text-sm shrink-0" aria-label="Dismiss">✕</button>
    </div>
  );
}

function Stat({ label, value, tone }) {
  return <div><div className={`num text-base font-semibold ${tone==='warn' && value>0 ? 'text-bad-600' : 'text-ink-900'}`}>{value}</div><div className="text-[11px] text-ink-400">{label}</div></div>;
}

// ═════════════════════════════════════════════════════════════════
// COMPONENT — Upload modal (add a statement any time after setup)
// ═════════════════════════════════════════════════════════════════
function UploadModal({ onClose }) {
  const { addTransactions } = useFinance();
  const inputRef = useRef(null);
  const [result, setResult] = useState(null);
  const [fileName, setFileName] = useState(null);
  const [importing, setImporting] = useState(false);

  const handleFile = (file) => {
    setFileName(file.name);
    const reader = new FileReader();
    reader.onload = () => {
      try { setResult(parseTransactionsCsv(reader.result)); }
      catch (err) { setResult({ transactions:[], errors:[{row:0,message:String(err)}], duplicatesSkipped:0, rowsRead:0 }); }
    };
    reader.onerror = () => setResult({ transactions:[], errors:[{row:0,message:'Could not read the file. Please try again.'}], duplicatesSkipped:0, rowsRead:0 });
    reader.readAsText(file);
  };
  const handleImport = () => {
    if (!result || !result.transactions.length) return;
    setImporting(true);
    addTransactions(result.transactions, `Imported ${result.transactions.length} transactions from ${fileName}`);
    setTimeout(onClose, 400);
  };
  const downloadSample = () => {
    const blob = new Blob([SAMPLE_CSV], { type:'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'sample-transactions.csv'; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="fixed inset-0 bg-ink-900/40 backdrop-blur-sm flex items-center justify-center z-50 px-4">
      <div className="w-full max-w-lg bg-surface border border-line rounded-xl2 shadow-card p-6">
        <div className="flex items-center justify-between mb-1"><h2 className="font-bold text-lg text-ink-900">Upload a statement</h2><button onClick={onClose} className="text-ink-400 hover:text-ink-700">✕</button></div>
        <p className="text-ink-500 text-sm mb-5">CSV with Date, Description, Amount columns (Type, Merchant, Category, Context optional). Context is stored locally and used only to explain patterns.</p>
        <div className="border border-dashed border-ink-400/40 rounded-lg px-5 py-8 text-center cursor-pointer hover:border-brand-400 transition-colors bg-surface2"
          onClick={()=>inputRef.current && inputRef.current.click()}
          onDragOver={e=>e.preventDefault()}
          onDrop={e=>{ e.preventDefault(); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handleFile(f); }}>
          <input ref={inputRef} type="file" accept=".csv,text/csv" className="hidden" onChange={e=>{ const f = e.target.files && e.target.files[0]; if (f) handleFile(f); }} />
          <div className="text-sm text-ink-700">{fileName ? <span className="num">{fileName}</span> : 'Click to choose a CSV file, or drag it here'}</div>
        </div>
        <div className="flex items-center justify-between mt-3">
          <button onClick={downloadSample} className="text-xs text-brand-600 hover:text-brand-700 underline underline-offset-2">Download sample CSV</button>
        </div>
        {result && (
          <div className="mt-5 space-y-3">
            <div className="flex gap-4 text-sm">
              <Stat label="Rows read" value={result.rowsRead} />
              <Stat label="Valid transactions" value={result.transactions.length} />
              <Stat label="Duplicates skipped" value={result.duplicatesSkipped} />
              <Stat label="Errors" value={result.errors.length} tone={result.errors.length?'warn':undefined} />
            </div>
            {result.errors.length > 0 && (
              <div className="max-h-32 overflow-y-auto rounded-md bg-bad-50 border border-bad-100 p-3 text-xs text-bad-600 space-y-1">
                {result.errors.slice(0,20).map((e,i) => <div key={i}>Row {e.row}: {e.message}</div>)}
                {result.errors.length > 20 && <div className="text-ink-400">…and {result.errors.length-20} more</div>}
              </div>
            )}
            <button disabled={!result.transactions.length || importing} onClick={handleImport}
              className="w-full rounded-lg bg-brand-500 hover:bg-brand-600 disabled:opacity-40 disabled:cursor-not-allowed transition-colors text-white font-semibold text-sm py-2.5">
              {importing ? 'Importing…' : `Import ${result.transactions.length} transaction${result.transactions.length===1?'':'s'}`}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// COMPONENT — Email sync modal (add synced transactions any time)
// ═════════════════════════════════════════════════════════════════
function EmailSyncModal({ onClose }) {
  const { addTransactions } = useFinance();
  const [stage, setStage] = useState('idle'); // idle | connecting | done
  const [found, setFound] = useState(0);

  const connect = () => {
    setStage('connecting');
    setTimeout(() => { setFound(generateEmailSyncTransactions().length); setStage('done'); }, 1500);
  };
  const confirmImport = () => {
    const raw = generateEmailSyncTransactions();
    const txns = raw.map(t => { const c = categorizeTransaction(t.description,t.merchant,t.type); return { ...t, category:c.category, categoryConfidence:c.confidence, categoryReason:c.reason }; });
    addTransactions(txns, `Synced ${txns.length} transactions from email (simulated)`);
    setTimeout(onClose, 400);
  };

  return (
    <div className="fixed inset-0 bg-ink-900/40 backdrop-blur-sm flex items-center justify-center z-50 px-4">
      <div className="w-full max-w-md bg-surface border border-line rounded-xl2 shadow-card p-6">
        <div className="flex items-center justify-between mb-1"><h2 className="font-bold text-lg text-ink-900">Connect email</h2><button onClick={onClose} className="text-ink-400 hover:text-ink-700">✕</button></div>
        <p className="text-ink-500 text-sm mb-5">Simulated integration — in production this would use a real Gmail/Outlook OAuth connection to scan transactional emails.</p>
        {stage==='idle' && (
          <button onClick={connect} className="w-full rounded-lg bg-brand-500 hover:bg-brand-600 transition-colors text-white font-semibold text-sm py-2.5 flex items-center justify-center gap-2">
            <span>✉️</span> Connect Gmail (demo)
          </button>
        )}
        {stage==='connecting' && (
          <div className="flex items-center gap-2.5 text-sm text-ink-500 py-3">
            <span className="w-4 h-4 rounded-full border-2 border-brand-300 border-t-brand-500 spin" /> Connecting to your inbox…
          </div>
        )}
        {stage==='done' && (
          <div className="space-y-3">
            <div className="text-sm text-good-600 flex items-center gap-2 bg-good-50 rounded-lg px-3 py-2"><span>✓</span> Found {found} transactions from receipts in the last ~45 days</div>
            <button onClick={confirmImport} className="w-full rounded-lg bg-brand-500 hover:bg-brand-600 transition-colors text-white font-semibold text-sm py-2.5">Import these transactions</button>
          </div>
        )}
      </div>
    </div>
  );
}

// COMPONENT — Add transaction modal (manual, one entry at a time)
// ═════════════════════════════════════════════════════════════════
function AddTransactionModal({ onClose }) {
  const { addTransactions } = useFinance();
  const [date, setDate] = useState(iso(new Date()));
  const [description, setDescription] = useState('');
  const [merchant, setMerchant] = useState('');
  const [context, setContext] = useState('');
  const [amount, setAmount] = useState('');
  const [type, setType] = useState('debit');
  const [error, setError] = useState('');
  const [addedCount, setAddedCount] = useState(0);

  const reset = () => { setDescription(''); setMerchant(''); setAmount(''); setContext(''); };

  const handleAdd = (andClose) => {
    const amt = Number(amount);
    if (!description.trim()) { setError('Add a short description.'); return; }
    if (!amt || amt <= 0) { setError('Enter an amount greater than 0.'); return; }
    setError('');
    const raw = { id: nextId('manual'), date, description: description.trim(), amount: amt, type, merchant: merchant.trim() || description.trim(), context: sanitizeTransactionContext(context) };
    const c = categorizeTransaction(raw.description, raw.merchant, raw.type);
    const txn = { ...raw, category: c.category, categoryConfidence: c.confidence, categoryReason: c.reason };
    addTransactions([txn], 'Added 1 transaction manually');
    setAddedCount(n => n + 1);
    if (andClose) { onClose(); } else { reset(); }
  };

  return (
    <div className="fixed inset-0 bg-ink-900/40 backdrop-blur-sm flex items-center justify-center z-50 px-4">
      <div className="w-full max-w-md bg-surface border border-line rounded-xl2 shadow-card p-6">
        <div className="flex items-center justify-between mb-1"><h2 className="font-bold text-lg text-ink-900">Add a transaction</h2><button onClick={onClose} className="text-ink-400 hover:text-ink-700">✕</button></div>
        <p className="text-ink-500 text-sm mb-5">Enter it by hand — no file or connection needed.</p>
        <div className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <ProfileField label="Date" value={date} onChange={setDate} type="date" />
            <label className="block">
              <span className="block text-xs font-medium text-ink-500 mb-1.5">Type</span>
              <select value={type} onChange={e=>setType(e.target.value)}
                className="w-full rounded-lg bg-surface2 border border-line focus:border-brand-500 focus:ring-2 focus:ring-brand-100 focus:outline-none px-3 py-2.5 text-sm text-ink-900">
                <option value="debit">Debit (money out)</option>
                <option value="credit">Credit (money in)</option>
              </select>
            </label>
          </div>
          <ProfileField label="Description" value={description} onChange={setDescription} type="text" />
          <div className="grid grid-cols-2 gap-3">
            <ProfileField label="Merchant (optional)" value={merchant} onChange={setMerchant} type="text" />
            <ProfileField label="Amount (₹)" value={amount} onChange={setAmount} type="number" />
          </div>
          <label className="block">
            <span className="block text-xs font-medium text-ink-500 mb-1.5">Context (optional)</span>
            <textarea value={context} onChange={e=>setContext(e.target.value.slice(0,240))} maxLength="240" rows="2"
              placeholder="What was this for? e.g. annual travel booking or shared dinner"
              className="w-full rounded-lg bg-surface2 border border-line focus:border-brand-500 focus:ring-2 focus:ring-brand-100 focus:outline-none px-3 py-2.5 text-sm text-ink-900 resize-none" />
            <span className="text-[11px] text-ink-400">Optional factual context only. Avoid passwords, account numbers, or sensitive personal details.</span>
          </label>
          {error && <p className="text-xs text-bad-600">{error}</p>}
          {addedCount > 0 && <p className="text-xs text-good-600">✓ {addedCount} transaction{addedCount===1?'':'s'} added so far this session.</p>}
          <div className="flex gap-2 pt-1">
            <button onClick={()=>handleAdd(false)} className="flex-1 rounded-lg bg-surface2 hover:bg-line/60 border border-line transition-colors text-ink-700 font-semibold text-sm py-2.5">Add & enter another</button>
            <button onClick={()=>handleAdd(true)} className="flex-1 rounded-lg bg-brand-500 hover:bg-brand-600 transition-colors text-white font-semibold text-sm py-2.5">Add & close</button>
          </div>
        </div>
      </div>
    </div>
  );
}

<script type="text/babel" data-presets="react">

// ═════════════════════════════════════════════════════════════════

function OverviewCards() {
  const { state } = useFinance();
  const { totalExpenses } = analyzeCurrentMonth(state.transactions);
  const savings = state.profile.goal ? state.profile.goal.savedSoFar : 0;
  const cards = [
    { label:'Monthly income', value: state.profile.income, icon:'💰' },
    { label:'Total expenses', value: totalExpenses, icon:'💳' },
    { label:'Available balance', value: state.profile.balance, icon:'🏦' },
    { label:'Current savings', value: savings, icon:'🎯', tone:'brand' },
  ];
  return (
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
      {cards.map(c => (
        <div key={c.label} className="rounded-xl2 border border-line bg-surface shadow-card px-5 py-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs text-ink-500 font-medium">{c.label}</span>
            <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-sm ${c.tone==='brand' ? 'bg-brand-50' : 'bg-surface2'}`}>{c.icon}</span>
          </div>
          <div className={`num text-2xl font-bold ${c.tone==='brand' ? 'text-brand-600' : 'text-ink-900'}`}>{inr(c.value)}</div>
        </div>
      ))}
